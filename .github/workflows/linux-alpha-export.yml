name: Linux Alpha development artifact

on:
  push:
    branches: [codex/linux-alpha-actions-export]
    paths:
      - .github/workflows/linux-alpha-export.yml
      - tools/ci_linux_alpha.py
      - tools/package_linux.py
      - tools/prepare_phase1.py
      - tools/phase2.py
      - tools/phase3.py
      - tools/verify_linux_package.py
      - packaging/**
      - config/**
      - branding/**
      - patches/**
      - upstream.lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-alpha-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MOZBUILD_STATE_PATH: /workspace/aelthoren-tools/mozbuild
      MOZCONFIG: ${{ github.workspace }}/config/mozconfig.linux-aelthoren
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Node for the pinned Mozilla frontend
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Prepare trusted distro dependencies and external paths
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang pkg-config libgtk-3-dev libdbus-glib-1-dev libxt-dev libasound2-dev libx11-xcb-dev libpulse-dev libegl1-mesa-dev inkscape desktop-file-utils xz-utils python3-venv ca-certificates fonts-dejavu-core
          python3 -m pip install 'zstandard==0.23.0'
          sudo install -d -o "$(id -u)" -g "$(id -g)" /workspace /workspace/aelthoren-tools/mozbuild /workspace/aelthoren-actions
          mkdir -p /workspace/aelthoren-actions/logs
          df -h /workspace
          python3 -c 'import shutil; assert shutil.disk_usage("/workspace").free >= 8 * 1024**3, "At least 8 GiB free disk required"'
      - name: Acquire exact official source and integrity-pinned artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/ci_linux_alpha.py prepare 2>&1 | tee /workspace/aelthoren-actions/logs/acquire.log
      - name: Official Mozilla artifact-mode bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cd /workspace/aelthoren-gecko
          ./mach --no-interactive bootstrap --application-choice browser_artifact_mode --no-system-changes 2>&1 | tee /workspace/aelthoren-actions/logs/bootstrap.log
      - name: Existing Phase 3 artifact build
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/ci_linux_alpha.py build 2>&1 | tee /workspace/aelthoren-actions/logs/build-driver.log
      - name: Existing Phase 5A official packaging workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/ci_linux_alpha.py package 2>&1 | tee /workspace/aelthoren-actions/logs/package-driver.log
      - name: Verify standalone archive in a clean non-root Debian container
        shell: bash
        run: |
          set -euo pipefail
          qa=/workspace/aelthoren-actions/qa
          checks=/workspace/aelthoren-actions/checks
          mkdir -p "$qa" "$checks"
          cp tools/verify_linux_package.py "$checks/verify.py"
          cp /workspace/aelthoren-gecko/toolkit/components/url-classifier/tests/UrlClassifierTestUtils.sys.mjs "$checks/"
          chmod 755 "$checks"
          chmod 644 "$checks/"* /workspace/aelthoren-actions/package/*.tar.xz
          sudo chown 1000:1000 "$qa"
          docker build -t aelthoren-actions-qa -f packaging/qa/Dockerfile packaging/qa 2>&1 | tee /workspace/aelthoren-actions/logs/qa-image.log
          docker run --rm \
            --mount type=bind,src=/workspace/aelthoren-actions/package/aelthoren-0.1.0-alpha-linux-x86_64.tar.xz,dst=/input/package.tar.xz,readonly \
            --mount "type=bind,src=$checks,dst=/checks,readonly" \
            --mount "type=bind,src=$qa,dst=/out" \
            aelthoren-actions-qa /bin/sh -c 'set -eu; mkdir -p "/tmp/Portable Alpha"; tar -xJf /input/package.tar.xz -C "/tmp/Portable Alpha"; cd "/tmp/Portable Alpha/aelthoren-0.1.0-alpha"; sha256sum -c MANIFEST.sha256; python3 /checks/verify.py "/tmp/Portable Alpha/aelthoren-0.1.0-alpha" /out' \
            2>&1 | tee /workspace/aelthoren-actions/logs/qa.log
      - name: Record actual checksum, size and original comparison
        run: python3 tools/ci_linux_alpha.py report
      - name: Upload verified development-only browser and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aelthoren-linux-alpha-development
          path: |
            /workspace/aelthoren-actions/package/*.tar.xz
            /workspace/aelthoren-actions/package/*.tar.xz.sha256
            /workspace/aelthoren-actions/package/package-result.json
            /workspace/aelthoren-actions/package/comparison.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded build and verification diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-alpha-export-diagnostics
          path: |
            /workspace/aelthoren-actions/logs/
            /workspace/aelthoren-actions/package/mach-package.log
            /workspace/aelthoren-actions/qa/results.json
          if-no-files-found: warn
          retention-days: 14
